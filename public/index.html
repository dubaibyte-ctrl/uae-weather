<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UAE Weather">
<title>UAE Rain &amp; Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1 id="title">UAE Rain &amp; Weather</h1>
  <div class="top-actions">
    <button id="notify" class="ghost" hidden></button>
    <button id="langBtn" class="ghost" aria-label="Language">ع</button>
  </div>
</header>

<!-- The single Leaflet map + its radar controls. Moved between the Home and Map views on tab switch. -->
<div id="mapWrap">
  <div id="map" role="application" aria-label="Map"></div>
  <div class="ctl">
    <button id="play"></button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Radar time">
    <span id="frameLbl" class="muted"></span>
  </div>
  <div id="legend" class="legend"></div>
</div>

<main id="app">
  <!-- ============ HOME ============ -->
  <section id="view-home" class="view" aria-label="Home">
    <section id="rainStatus" class="card status" aria-live="polite"></section>
    <div id="homeMapSlot" class="mapslot"></div>
    <section id="homeRain" class="card"></section>
    <section id="homeNearMe" class="card"></section>
    <section id="homeCommunity" class="card"></section>
  </section>

  <!-- ============ MAP ============ -->
  <section id="view-map" class="view" hidden aria-label="Map">
    <section class="search">
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <div id="results" class="results" hidden></div>
    </section>
    <nav id="chips" class="chips" aria-label="Cities"></nav>
    <div id="mapSlot" class="mapslot"></div>
    <main id="detail"></main>
  </section>

  <!-- ============ ALERTS ============ -->
  <section id="view-alerts" class="view" hidden aria-label="Alerts">
    <div id="alerts"></div>
    <section id="safetySlot" class="card"></section>
    <section id="savedSlot" class="card"></section>
  </section>

  <!-- ============ MORE ============ -->
  <section id="view-more" class="view" hidden aria-label="More">
    <div id="pills" class="pills"></div>
    <section id="rain" class="card rain" aria-live="polite"></section>
    <section id="community" class="card community" aria-live="polite"></section>
    <details id="advanced" class="card">
      <summary id="advancedSummary">Advanced diagnostics</summary>
      <section id="validation"></section>
      <section id="about"></section>
    </details>
  </section>

  <!-- kept for modules that still populate it; the Home banner supersedes it -->
  <section id="overview" hidden></section>
</main>

<nav id="tabbar" class="tabbar" role="tablist" aria-label="Sections"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
<script src="rain.js"></script>
<script src="community.js"></script>
<script src="home.js"></script>
</body>
</html>
